<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Library Admin</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="admin-page">
    <header class="navbar">
        <a class="logo" href="/">GAME LIBRARY ADMIN</a>
        <a class="back-link" href="/">View Website</a>
    </header>

    <main class="admin-container">
        <section id="login-section" class="admin-section">
            <h1>Admin Login</h1>

            <form id="login-form" class="admin-form">
                <input
                    id="username"
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                >

                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button class="admin-button" type="submit">Login</button>
            </form>

            <p id="login-message"></p>
        </section>

        <section id="dashboard" class="admin-section" style="display:none">
            <div class="admin-actions">
                <button class="admin-button" type="button" onclick="showAddGame()">
                    + Add Game
                </button>
                <button class="admin-button secondary" type="button" onclick="logout()">
                    Logout
                </button>
            </div>

            <h1 style="margin-top:25px">Admin Dashboard</h1>

            <section>
                <h2>Website Text</h2>

                <form id="content-form" class="admin-form">
                    <input id="hero-title" placeholder="Hero Title">
                    <input id="hero-subtitle" placeholder="Hero Subtitle">
                    <input id="announcement" placeholder="Announcement">
                    <textarea id="about-text" placeholder="About Text"></textarea>

                    <button class="admin-button" type="submit">
                        Save Website Text
                    </button>
                </form>
            </section>

            <section style="margin-top:30px">
                <h2>Games</h2>
                <div id="admin-games">
                    <p class="loading">Loading games...</p>
                </div>
            </section>
        </section>

        <section id="game-form" class="admin-section" style="display:none">
            <h2>Add New Game</h2>

            <form id="add-game-form" class="admin-form" enctype="multipart/form-data">
                <input name="name" placeholder="Game name" required>
                <textarea name="description" placeholder="Description" required></textarea>
                <input name="category" placeholder="Category" required>
                <input name="playable_url" placeholder="Playable URL" required>
                <input name="creator" placeholder="Creator / Team" required>

                <label>
                    Thumbnail
                    <input
                        name="thumbnail"
                        type="file"
                        accept=".png,.jpg,.jpeg,.webp"
                    >
                </label>

                <label>
                    <input name="published" type="checkbox">
                    Publish immediately
                </label>

                <label>
                    <input name="featured" type="checkbox">
                    Featured game
                </label>

                <div class="admin-actions">
                    <button class="admin-button" type="submit">
                        Add Game
                    </button>
                    <button
                        class="admin-button secondary"
                        type="button"
                        onclick="hideAddGame()"
                    >
                        Cancel
                    </button>
                </div>
            </form>
        </section>
    </main>

    <script src="/assets/admin.js"></script>
</body>
</html>
